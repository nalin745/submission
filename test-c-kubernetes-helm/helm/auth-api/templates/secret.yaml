{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
# Chart-managed Secret. Use only for dev / CI. For staging/prod set
# secret.create=false and secret.existingSecret=<name> (External Secrets, CSI driver, kubectl).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-api.secretName" . }}
  labels:
    {{- include "auth-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.create=true" .Values.secret.databaseUrl | quote }}
  REDIS_URL: {{ required "secret.redisUrl is required when secret.create=true" .Values.secret.redisUrl | quote }}
{{- end }}
