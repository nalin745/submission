# !!! TEMPLATE ONLY - PLACEHOLDER VALUES !!!
# Do NOT commit real credentials. In real environments create this Secret out-of-band:
#   kubectl -n auth-api create secret generic auth-api-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_URL='redis://...'
# or sync it from AWS Secrets Manager with External Secrets Operator / Secrets Store CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: auth-api-secrets
  labels:
    app.kubernetes.io/name: auth-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@rds-endpoint:5432/authdb"
  REDIS_URL: "redis://default:password@elasticache-endpoint:6379"
