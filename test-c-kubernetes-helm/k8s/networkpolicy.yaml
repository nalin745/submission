apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-api
  labels:
    app.kubernetes.io/name: auth-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.16.0/24
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.0.32.0/24
      ports:
        - protocol: TCP
          port: 6379
